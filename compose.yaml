services:
  # Discord bot — single orchestration point for the full pipeline
  # (fetch emails, scrape job URLs, persist to Firestore, post to Discord).
  discord-bot:
    build:
      context: .
      target: base
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
